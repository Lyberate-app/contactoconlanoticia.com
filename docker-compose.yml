version: "3.9"

# ══════════════════════════════════════════════════════════
# Portal Editorial — Docker Compose (Desarrollo Local)
# ══════════════════════════════════════════════════════════
# Uso:
#   docker compose up -d          → inicia todos los servicios
#   docker compose up -d mysql    → solo la BD
#   docker compose logs -f api    → logs del backend
#   docker compose exec api bash  → shell en el contenedor PHP

services:

  # ──────────────────────────────────────
  # MySQL 8
  # ──────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: portal_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: portal_editorial
      MYSQL_USER: portal_user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - portal_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────
  # Redis 7
  # ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: portal_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - portal_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ──────────────────────────────────────
  # Backend PHP/Laravel
  # ──────────────────────────────────────
  api:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: portal_api
    restart: unless-stopped
    working_dir: /var/www/api
    volumes:
      - ./api:/var/www/api
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=local
      - DB_HOST=mysql
      - DB_DATABASE=portal_editorial
      - DB_USERNAME=portal_user
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - portal_network
    command: php artisan serve --host=0.0.0.0 --port=8000

  # ──────────────────────────────────────
  # Queue Worker (procesa jobs de imágenes)
  # ──────────────────────────────────────
  worker:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: portal_worker
    restart: unless-stopped
    working_dir: /var/www/api
    volumes:
      - ./api:/var/www/api
    environment:
      - APP_ENV=local
      - DB_HOST=mysql
      - DB_DATABASE=portal_editorial
      - DB_USERNAME=portal_user
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      - api
    networks:
      - portal_network
    command: php artisan queue:work --tries=3 --timeout=120

  # ──────────────────────────────────────
  # Frontend Público (Next.js)
  # Nota: en desarrollo se recomienda correr
  # "pnpm dev:web" directamente en la máquina
  # para mejor HMR. Este servicio es opcional.
  # ──────────────────────────────────────
  web:
    image: node:20-alpine
    container_name: portal_web
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000/api/v1
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - portal_network
    command: sh -c "npm install && npm run dev"
    profiles:
      - full  # Solo se inicia con: docker compose --profile full up

  # ──────────────────────────────────────
  # Panel Admin (Vite)
  # Similar al web, se recomienda correr
  # "pnpm dev:admin" localmente.
  # ──────────────────────────────────────
  admin:
    image: node:20-alpine
    container_name: portal_admin
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - portal_network
    command: sh -c "npm install && npm run dev -- --host"
    profiles:
      - full

  # ──────────────────────────────────────
  # phpMyAdmin (desarrollo, opcional)
  # ──────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: portal_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: portal_user
      PMA_PASSWORD: secret
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - portal_network
    profiles:
      - tools

  # ──────────────────────────────────────
  # Redis Commander (desarrollo, opcional)
  # ──────────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: portal_redis_ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - portal_network
    profiles:
      - tools

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  portal_network:
    driver: bridge

