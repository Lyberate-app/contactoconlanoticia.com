services:
  # Backend REST API (PHP 8.2 + Apache)
  api:
    image: php:8.2-apache
    container_name: lyberate_api
    ports:
      - "8000:80"
    volumes:
      - ./backend/public:/var/www/html
      - ./backend:/var/www/backend
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=lyberate_db
      - DB_USERNAME=lyberate_user
      - DB_PASSWORD=lyberate_password
    depends_on:
      - db

  # Database (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: lyberate_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: lyberate_db
      MYSQL_USER: lyberate_user
      MYSQL_PASSWORD: lyberate_password
      MYSQL_ROOT_PASSWORD: root_password_local
    volumes:
      - lyberate_mysql_data:/var/lib/mysql

volumes:
  lyberate_mysql_data:

